name: Automatic Flight Tracker

on:
  schedule:
    # 每天香港時間早上 08:00 自動執行 1 次
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授權寫入權限以更新歷史數據
    steps:
      - name: 讀取專案程式
        uses: actions/checkout@v3

      - name: 載入 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝必要元件
        run: pip install requests

      - name: 執行追蹤程式
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python tracker.py

      - name: 自動儲存並提交歷史價格檔
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price_history.json || true
          git commit -m "Update flight price history" || exit 0
          git push
