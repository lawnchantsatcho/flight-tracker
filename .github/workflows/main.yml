name: Automatic Flight Tracker

on:
  schedule:
    # 每 3 小時觸發一次檢查（Cron 時間為 UTC）
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授權寫入權限以更新歷史數據與追蹤狀態
    steps:
      - name: 讀取專案程式
        uses: actions/checkout@v4

      - name: 載入 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要元件
        run: pip install requests

      - name: 執行追蹤程式
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python tracker.py

      - name: 自動儲存並提交歷史價格檔與追蹤狀態
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price_history.json tracking_mode.json || true
          git commit -m "Update flight price history & tracking mode" || exit 0
          git push
